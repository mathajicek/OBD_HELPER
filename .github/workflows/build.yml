name: Test & build

on:
  push:
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      # Dart symbols are obfuscated; the symbol map stays out of the APK and
      # is kept as a separate artifact for reading crash stack traces.
      - run: flutter build apk --release --obfuscate --split-debug-info=build/symbols
      - uses: actions/upload-artifact@v5
        with:
          name: obd-pulse-apk
          path: build/app/outputs/flutter-apk/app-release.apk
      - uses: actions/upload-artifact@v5
        with:
          name: obd-pulse-symbols
          path: build/symbols

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      # Unsigned build: it is signed with the user's own Apple ID when it is
      # installed (Xcode, Sideloadly or AltStore), see README.
      - run: flutter build ios --release --no-codesign --obfuscate --split-debug-info=build/symbols-ios
      - run: |
          mkdir -p build/ipa/Payload
          cp -R build/ios/iphoneos/Runner.app build/ipa/Payload/
          cd build/ipa && zip -qr OBD-Pulse-unsigned.ipa Payload
      - uses: actions/upload-artifact@v5
        with:
          name: obd-pulse-ios-unsigned
          path: build/ipa/OBD-Pulse-unsigned.ipa
